modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Client-only mixin that injects the Quests button into MCA's villager menu.
[[mixins]]
    config="mcaquests.mixins.json"

# MCA: Quests is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities, professions, and registries are present.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    type="required"
    versionRange="[7.7,8)"
    ordering="AFTER"
    side="BOTH"

# NOTE: the architectury dependency is gone — MCA 1.21.1 no longer uses Architectury.

# FTB Quests is an optional integration (compat.ftbq): load AFTER it when present so
# its built-in TaskTypes are initialized before our constructor registers types.
[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[2101.1,)"
    ordering="AFTER"
    side="BOTH"

# MCA: Reputation is an OPTIONAL integration. Quests loads and plays fully without it, using its own
# per-player village standing store. When present we load AFTER it so its API, registries, and saved
# data exist before ReputationBridge picks a backend; from that point Reputation owns the canonical
# standing and Quests keeps a mirrored fallback copy so removing it later does not reset anybody
# (spec 9.3, 32.6).
[[dependencies.${mod_id}]]
    modId="mcareputation"
    type="optional"
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"
