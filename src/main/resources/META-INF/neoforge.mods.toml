modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Client-only mixins: the glow highlight and the Screen accessor the Quests button injection uses.
[[mixins]]
    config="mcaquests.mixins.json"

# MCA: Quests is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities, professions, and registries are present.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    type="required"
    versionRange="${mca_version_range}"
    ordering="AFTER"
    side="BOTH"

# NOTE: no architectury dependency -- MCA 1.21.1 no longer uses Architectury.

# FTB Quests is an optional integration (compat.ftbq): load AFTER it when present so
# its built-in TaskTypes are initialized before our constructor registers types.
[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="${ftbquests_version_range}"
    ordering="AFTER"
    side="BOTH"

# MCA: Reputation is an OPTIONAL integration. Quests loads and plays fully without it, using its own
# per-player village standing store. When present we load AFTER it so its API, registries, and saved
# data exist before ReputationBridge picks a backend; from that point Reputation owns the canonical
# standing and Quests keeps a mirrored fallback copy so removing it later does not reset anybody
# (spec 9.3, 32.6).
[[dependencies.${mod_id}]]
    modId="mcareputation"
    type="optional"
    versionRange="${mcareputation_version_range}"
    ordering="AFTER"
    side="BOTH"

# Townstead is an OPTIONAL integration (compat.townstead). Quests loads and plays exactly as it does
# today without it. When present we load AFTER it so its registries, profession/skill definitions and
# saved data exist before TownsteadCompat binds; from that point Townstead needs, schedules,
# professions, skills, buildings and village spirit become quest state. Removing Townstead later does
# not corrupt a save: active Townstead objectives suspend with their baselines intact and can still be
# abandoned (Townstead spec 1.2, 10.1).
[[dependencies.${mod_id}]]
    modId="townstead"
    type="optional"
    versionRange="${townstead_version_range}"
    ordering="AFTER"
    side="BOTH"

# JourneyMap is an OPTIONAL, CLIENT-SIDE integration. When present, the quest destinations the tracker
# already names also appear as waypoints on the map -- one per active quest that has somewhere to send
# you, taken away when the quest ends. CLIENT only -- a waypoint is a thing on one player's map. Range
# starts at 6.0.0, where the API moved to v2 and the Waypoint constructor this mod used to be able to
# call was replaced by a factory.
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="${journeymap_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Xaero's Minimap is an OPTIONAL, CLIENT-SIDE integration, on the same terms. It ships no API package
# at all, so the binding reaches its third-party waypoint store -- the one its own Waystones support
# uses -- by name. Those waypoints are never written to the player's saved waypoint files: they belong
# to the quest, so uninstalling this mod leaves nothing behind to tidy up.
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="${xaero_version_range}"
    ordering="AFTER"
    side="CLIENT"
