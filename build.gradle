plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ requires Java 21; the foojay resolver provisions it if absent.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // JUnit tests that need Minecraft classes on the classpath (the whole test suite does --
    // TestBootstrap touches SharedConstants/Bootstrap).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // MCA Reborn via Modrinth Maven, scoped to the maven.modrinth group. The 1.21.1 NeoForge jar is
    // mojmap -- no deobf pipeline exists or is needed.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }

    // FTB Quests optional integration -- scoped to dev.ftb.mods only.
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter { includeGroup 'dev.ftb.mods' }
    }

    // Architectury API -- transitive compile-time dependency of the FTB 2101.x stack (NOT of this
    // mod; MCA 1.21.1 itself dropped Architectury). Never shipped.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev/'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }

    // JourneyMap's client plugin API -- scoped to info.journeymap only.
    //
    // Not JourneyMap's own Nexus (jm.gserv.me): modmaven.dev is the reachable mirror carrying the
    // artifacts. What JourneyMap 1.21.1-6.0.x loads is journeymap-api-neoforge, byte-for-byte the API
    // surface of the jar-in-jar inside the mod jar, which mapProbeTest re-checks against a real
    // JourneyMap jar on demand.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModMaven'
                url = 'https://modmaven.dev'
            }
        }
        filter { includeGroup 'info.journeymap' }
    }
}

// Which MCA build dev runs launch with. Overridable per invocation so several MCA builds can be
// exercised without editing a file: `./gradlew runServer -PmcaDevVersion=<modrinth version id>`.
ext.mcaDevVersion = project.findProperty('mcaDevVersion') ?: mca_dev_version

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older root would go untested, which is exactly how the missing
// forge.net.conczin.mca root reached players. Each is probed in its own class loader, so a root the
// binding no longer recognises fails the build instead of a user's log.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in would only slow the build.
        transitive = false
    }
}

// Extra MCA jars to probe that no Maven can serve (a local build, a file pulled by hand):
//     ./gradlew test "-PmcaProbeJars=C:\jars\mca-a.jar;C:\jars\mca-b.jar"
ext.mcaProbeExtraJars = (project.findProperty('mcaProbeJars') ?: '')
        .toString().split(';').collect { it.trim() }.findAll { !it.isEmpty() }

configurations {
    // Keep MCA off the unit-test runtime. Gradle's testRuntimeOnly extends runtimeOnly, so the dev-run
    // MCA jar would otherwise land on testRuntimeClasspath -- and the unit suite is precisely where
    // "MCA is absent" has to be the real, exercised state, because that is the degradation path
    // McaCompatSafeFailTest asserts. McaBindingProbeTest still reaches the real MCA jar, by opening it
    // in a throwaway class loader rather than by having it on the classpath.
    testRuntimeClasspath {
        exclude group: 'maven.modrinth', module: 'minecraft-comes-alive-reborn'
    }
}

dependencies {
    // MCA Reborn -- the NeoForge jar is mojmap and loads as a mod in dev runs.
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime (that is what lets
    // one jar serve both MCA's forge.net.mca.* layout and the renamed net.conczin.mca.* one). A
    // compile dependency would only invite the static linkage back -- NoMcaStaticLinkTest fails the
    // build if it ever returns. The explicit testRuntimeClasspath exclusion above keeps MCA absent,
    // so the unit suite exercises the genuine "MCA absent" degradation path.
    runtimeOnly "maven.modrinth:minecraft-comes-alive-reborn:${mcaDevVersion}"

    // The probe fleet (see ext.mcaProbeVersions), one configuration per Modrinth version id.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }

    // MCA: Reputation -- OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its class output (the 1.21.1 NeoForge port). Never bundled: the
    // real mod supplies these classes at runtime, and everything that touches them is gated behind
    // ReputationBridge's ModList check.
    //
    // A missing sibling is a hard error, not a warning: a jar built without this compile surface
    // advertises an integration it cannot perform (spec 9.2). -PskipReputationCompat=true exists for
    // a local compile-only loop and deliberately makes `jar` fail, so the skip cannot be shipped.
    def mcaReputationClasses = file(project.findProperty('mcaReputationClasses')
            ?: "${projectDir}/../MCAReputation_1.21.1/build/classes/java/main")
    def skipReputationCompat = project.findProperty('skipReputationCompat')?.toString() == 'true'
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else if (!skipReputationCompat) {
        throw new GradleException("MCA: Reputation compile surface missing at ${mcaReputationClasses}. " +
                "Build the sibling (cd ../MCAReputation_1.21.1 && ./gradlew classes) or pass " +
                "-PskipReputationCompat=true for a non-shippable build.")
    } else {
        logger.warn("MCA: Reputation compile surface skipped; excluding compat/reputation/** from " +
                "compilation and refusing to package a jar.")
        sourceSets.main.java.exclude 'dev/otectus/mcaquests/compat/reputation/**'
        tasks.named('jar') {
            doFirst {
                throw new GradleException("Refusing to package: Reputation compat was skipped")
            }
        }
    }

    // Unit tests for the non-MCA quest engine (spec section 33).
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JourneyMap optional integration -- compile-time only. NEVER shipped, NEVER 'implementation'.
    //
    // Like the guarded FTB Quests and Reputation adapters, this package uses typed compile-only APIs:
    // JourneyMap's entry point is a class carrying @JourneyMapPlugin and implementing IClientPlugin,
    // and neither an annotation nor an implements clause can be produced reflectively. Only
    // compat/journeymap/ names these types, and NoMinimapStaticLinkTest fails the build if anything
    // else does -- so a dedicated server, or a client without JourneyMap, never loads that package.
    //
    // testImplementation as well -- compile *and* test runtime, since JourneyMapWaypointBackendTest
    // hands the backend a stub IClientAPI and has to load the real interface to implement it. Test
    // scope only; nothing about this reaches the jar.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    testImplementation "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"

    // FTB Quests optional integration -- compile-time only. NEVER shipped, NEVER 'implementation'.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    // Optional: put the FTB stack on the dev runtime for hands-on testing.
    if (project.hasProperty('enableFtbqInDev') && project.enableFtbqInDev.toBoolean()) {
        runtimeOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    }

    // Optional: put MCA Capitals on the dev runtime for hands-on testing. Never a compile dependency
    // -- CapitalsBinding resolves it by name -- and never shipped. Capitals needs MCA 7.7.35-beta.3 or
    // newer, which the default dev MCA (mca_dev_version) already satisfies:
    //
    //     ./gradlew runClient -PenableCapitalsInDev=true
    if (project.hasProperty('enableCapitalsInDev') && project.enableCapitalsInDev.toBoolean()) {
        runtimeOnly "maven.modrinth:capitals-a-monarchy-mod-for-mca-reborn:ZSqQbuHC"
    }
}

// A jar carrying nothing but a mods.toml, declaring modId `mca`.
//
// The MDG unit-test runner boots FML and loads this mod (see neoForge.unitTest.testedMod), and
// neoforge.mods.toml declares `mca` as a *required* dependency -- so without something answering to
// that id the whole suite dies in ModLoader with "mca is not installed". Putting the real MCA jar on
// testRuntimeClasspath is exactly what the exclusion above forbids: "MCA is not bound" is the state
// McaCompatSafeFailTest exercises, and McaBindingProbeTest reaches the real jar through its own class
// loader instead. A manifest with no classes behind it satisfies the loader and leaves the classpath
// as MCA-free as before.
def mcaTestStub = tasks.register('mcaTestStubJar', Jar) {
    group = 'verification'
    description = 'Manifest-only stand-in for MCA, so FML can load this mod in the unit-test JVM.'
    archiveBaseName = 'mca-unit-test-stub'
    destinationDirectory = layout.buildDirectory.dir('unit-test-stub')
    // The version only has to fall inside mca_version_range; nothing reads it.
    def stubToml = """modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="Manifest-only test stand-in; contains no code."

[[mods]]
modId="mca"
version="7.7.0"
displayName="Minecraft Comes Alive (unit-test stand-in)"
description="No classes. Exists only so FML's dependency check passes with MCA genuinely absent."
"""
    def stubDir = layout.buildDirectory.dir('unit-test-stub/src')
    doFirst {
        def toml = stubDir.get().file('META-INF/neoforge.mods.toml').asFile
        toml.parentFile.mkdirs()
        toml.text = stubToml
    }
    from(stubDir)
}

test {
    useJUnitPlatform()
    dependsOn mcaTestStub
    classpath += files(mcaTestStub)
    // The MDG unitTest runner's working dir is build/minecraft-junit; the repo-introspection tests
    // (pack parsing, locale parity, classfile scans) resolve paths through this property.
    systemProperty 'mcaquests.projectRoot', project.projectDir.absolutePath
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without MCA ever being
    // linked into the test JVM. They come from the mcaProbe* configurations, one per version, so that
    // Gradle's conflict resolution cannot collapse the fleet down to the newest jar; -PmcaProbeJars
    // appends local jars no Maven can serve.
    //
    // The whole fleet is probed on every run (see mca_probe_versions), one entry per known package
    // root, so a root the binding no longer recognises fails here. Resolved in doFirst, not at
    // configuration time, so configuring the build never has to reach the network.
    doFirst {
        systemProperty 'mcaquests.probe.jars', (mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .collect { it.toString() } + mcaProbeExtraJars)
                .join(File.pathSeparator)
    }
}

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own
// classloader. Separate from `test` because it needs a jar nobody can resolve from a maven: Townstead
// is published on CurseForge only, so the path is supplied by the person running it.
//
//     ./gradlew townsteadProbeTest -PtownsteadModernJar=/path/townstead-0.7.6.jar
//
// Both -PtownsteadModernJar and -PtownsteadFloorJar are accepted and either may be given alone. MCA
// rides along on `mcaquests.probe.jars` for a load-bearing reason: Townstead is compiled against MCA,
// so enumerating TownsteadAPI's methods resolves an MCA parameter type, and without MCA present the
// whole class reads as unbound and the probe would pass vacuously.
//
// With no jar the task skips loudly rather than passing vacuously; -PrequireTownsteadJar=true turns a
// missing jar into a failure, so a release gate cannot pass on a run that probed nothing.
tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.TownsteadBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    // The SKIPPED report lives in onlyIf rather than doFirst: onlyIf is evaluated first, and a
    // doFirst on a skipped task never runs.
    onlyIf {
        def supplied = ['townsteadModernJar', 'townsteadFloorJar'].findAll { project.hasProperty(it) }
        if (!supplied.isEmpty()) {
            return true
        }
        if (project.findProperty('requireTownsteadJar')?.toString() == 'true') {
            throw new GradleException('No Townstead jar supplied, but -PrequireTownsteadJar=true. Pass ' +
                    '-PtownsteadModernJar=<path> and/or -PtownsteadFloorJar=<path>.')
        }
        logger.lifecycle('SKIPPED: no Townstead jar supplied (-PtownsteadModernJar/-PtownsteadFloorJar)')
        false
    }
    doFirst {
        systemProperty 'mcaquests.townstead.probe.jars',
                ['townsteadModernJar', 'townsteadFloorJar']
                        .findAll { project.hasProperty(it) }
                        .collect { project.property(it).toString() }
                        .join(File.pathSeparator)
        systemProperty 'mcaquests.probe.jars', (mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .collect { it.toString() } + mcaProbeExtraJars)
                .join(File.pathSeparator)
    }
}

// Checks both map integrations against real mod jars, in their own JVM and their own class loader.
// Separate from `test` because the mod jars cannot be resolved from a Maven: both are CurseForge-only
// (libs/ is gitignored), so the paths are supplied by whoever runs it.
//
//     ./gradlew mapProbeTest -PjourneymapJar=libs/journeymap-neoforge-1.21.1-6.0.3.jar
//                            -PxaeroJar=libs/xaerominimap-neoforge-1.21.1-26.4.2.jar
//
// The two halves ask different questions, because the two integrations are bound differently. Xaero
// ships no API, so its manifest is resolved by name and this is the only thing that can prove the
// names are right. JourneyMap is compiled against, so its members are already pinned by javac -- what
// this checks there is *drift*: the runtime API is the journeymap-api jar-in-jar inside the mod jar,
// the compile API is journeymap_api_version from a Maven mirror, and nothing but this task notices
// the day those two stop agreeing.
//
// Either may be given alone; a mod with no jar is skipped rather than failed -- unless
// -PrequireMapJars=true, which turns every missing jar into a failure so a release gate cannot pass
// on a run that silently probed nothing.
tasks.register('mapProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Xaero binding manifest and the JourneyMap API against supplied jars.'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.map.MapBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaquests.map.probe.journeymap',
                project.findProperty('journeymapJar')?.toString() ?: ''
        systemProperty 'mcaquests.map.probe.xaero',
                project.findProperty('xaeroJar')?.toString() ?: ''
        systemProperty 'mcaquests.map.probe.require',
                project.findProperty('requireMapJars')?.toString() ?: 'false'
    }
}

// Replays the Ice & Fire manifest against real Ice & Fire jars. Separate from `check` because neither
// jar is resolvable from a Maven the build controls: Community Edition is on Modrinth and the original
// on CurseForge, so the paths come from whoever runs it.
//
//     ./gradlew iceAndFireProbeTest -PiceandfireCeJar=<path> -PiceandfireOriginalJar=<path>
//
// Either may be given alone; the half with no jar skips itself. Unlike the Townstead and map probes
// these are raw jar paths with no configuration and no deobfuscation: the test only reads bytes out of
// a zip and parses a constant pool, and never loads a class from either jar.
tasks.register('iceAndFireProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Ice & Fire registry manifest against supplied Ice & Fire jars.'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.iceandfire.IceAndFireJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    // The SKIPPED report lives in onlyIf rather than doFirst: onlyIf is evaluated first, and a
    // doFirst on a skipped task never runs.
    onlyIf {
        if (project.hasProperty('iceandfireCeJar') || project.hasProperty('iceandfireOriginalJar')) {
            return true
        }
        logger.lifecycle('SKIPPED: no Ice & Fire jar supplied (-PiceandfireCeJar/-PiceandfireOriginalJar)')
        false
    }
    doFirst {
        systemProperty 'mcaquests.iceandfire.probe.ce',
                project.findProperty('iceandfireCeJar')?.toString() ?: ''
        systemProperty 'mcaquests.iceandfire.probe.original',
                project.findProperty('iceandfireOriginalJar')?.toString() ?: ''
    }
}

// Replays the Bountiful manifest against a real Bountiful jar. Separate from `check` for the same
// reason as the Ice & Fire probe: Bountiful is CurseForge-only, so the path comes from whoever runs it.
//
//     ./gradlew bountifulProbeTest -PbountifulJar=<path>
//
// The test only reads bytes out of a zip and parses a constant pool; it never loads a class from the
// jar, which it could not do anyway without kotlinforforge and Kambrik on the classpath.
tasks.register('bountifulProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Bountiful binding manifest against a supplied Bountiful jar.'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.bountiful.BountifulJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    // The SKIPPED report lives in onlyIf rather than doFirst: onlyIf is evaluated first, and a
    // doFirst on a skipped task never runs.
    onlyIf {
        if (project.hasProperty('bountifulJar')) {
            return true
        }
        logger.lifecycle('SKIPPED: no Bountiful jar supplied (-PbountifulJar)')
        false
    }
    doFirst {
        systemProperty 'mcaquests.bountiful.probe.jar',
                project.findProperty('bountifulJar')?.toString() ?: ''
    }
}

// Replays the Capitals binding manifest against a real MCA Capitals jar, in its own JVM and its own
// class loader. Separate from `check` because the jar comes from Modrinth rather than this build's
// dependency graph, so its path is supplied by whoever runs it:
//
//     ./gradlew capitalsProbeTest -PcapitalsJar=<path>
//
// MCA rides along on `mcaquests.probe.jars` for the same load-bearing reason Townstead's probe needs
// it: Capitals statically imports MCA throughout, so enumerating a Capitals class's methods resolves
// MCA parameter types, and without MCA present whole classes read as unbound and the probe would pass
// vacuously. Only the fleet member Capitals declares support for is fed to it -- S2Ln2tIn
// (7.7.36-beta.3), the one inside the [7.7.35-beta.3,7.8.0) range in its own neoforge.mods.toml --
// because the older fleet member leaves the same members unresolvable.
tasks.register('capitalsProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the MCA Capitals binding manifest against a supplied Capitals jar.'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.capitals.CapitalsBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    // The SKIPPED report lives in onlyIf rather than doFirst: onlyIf is evaluated first, and a
    // doFirst on a skipped task never runs.
    onlyIf {
        if (project.hasProperty('capitalsJar')) {
            return true
        }
        logger.lifecycle('SKIPPED: no MCA Capitals jar supplied (-PcapitalsJar)')
        false
    }
    doFirst {
        systemProperty 'mcaquests.capitals.probe.jar',
                project.findProperty('capitalsJar')?.toString() ?: ''
        systemProperty 'mcaquests.probe.jars', mcaProbeVersions.indices
                .findAll { i -> mcaProbeVersions[i] == 'S2Ln2tIn' }
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .collect { it.toString() }
                .join(File.pathSeparator)
    }
}

// ModDevGradle configures `test` late (unitTest wires in the Minecraft classpath, the JUnit runner and
// its JVM args), so the probe tasks inherit that configuration here instead of assembling a
// second, subtly different runtime out of sourceSets.
afterEvaluate {
    def base = tasks.named('test', Test).get()
    ['townsteadProbeTest', 'mapProbeTest', 'iceAndFireProbeTest', 'bountifulProbeTest',
     'capitalsProbeTest', 'mapAtlasesProbeTest'].each { name ->
        tasks.named(name, Test).configure {
            classpath = base.classpath
            testClassesDirs = base.testClassesDirs
            jvmArgs = base.jvmArgs
            // MDG supplies fml.modFolders lazily through a provider. Without it the optional
            // mixin plugin lands in the app loader instead of sharing FML's Mixin interface.
            jvmArgumentProviders.addAll(base.jvmArgumentProviders)
            javaLauncher = base.javaLauncher
            // Includes MDG's generated launch files and manifest stub without running `test`.
            dependsOn { base.taskDependencies.getDependencies(base) }
            base.systemProperties.each { key, value -> systemProperty(key, value) }
            workingDir = base.workingDir
            environment base.environment
        }
    }
}

// Expand metadata placeholders into neoforge.mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neoforge_version           : neoforge_version,
            neoforge_version_range     : neoforge_version_range,
            loader_version_range       : loader_version_range,
            mca_version_range          : mca_version_range,
            ftbquests_version_range    : ftbquests_version_range,
            mcareputation_version_range: mcareputation_version_range,
            townstead_version_range    : townstead_version_range,
            mcacapitals_version_range  : mcacapitals_version_range,
            journeymap_version_range   : journeymap_version_range,
            xaero_version_range        : xaero_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac stops at 100 diagnostics by default; the port needs the full picture.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// NeoForge uses official runtime mappings, so there is no SRG reobfuscation check. Verify complete
// metadata, isolated classes and the Java 21 ceiling directly from the finished archive instead.
def verifyNeoQuestArchive = { File archive ->
    int classCount = 0
    new java.util.zip.ZipFile(archive).withCloseable { zip ->
        ['META-INF/neoforge.mods.toml', 'mcaquests.mixins.json', 'mcaquests.compat.mixins.json',
         'pack.mcmeta', 'compatpacks/iafce_quests/pack.mcmeta', 'compatpacks/bountiful_core/pack.mcmeta',
         'compatpacks/bountiful_iafce/pack.mcmeta', 'assets/mcaquests/lang/en_us.json',
         'assets/mcaquests/lang/pt_br.json'].each { required ->
            def entry = zip.getEntry(required)
            if (entry == null) throw new GradleException("${archive.name}: missing ${required}")
            zip.getInputStream(entry).withCloseable { input ->
                if (input.getText('UTF-8').contains('${')) {
                    throw new GradleException("${archive.name}: unexpanded metadata in ${required}")
                }
            }
        }
        zip.entries().each { entry ->
            if (!entry.name.endsWith('.class')) return
            if (!entry.name.startsWith('dev/otectus/mcaquests/')) {
                throw new GradleException("${archive.name}: unexpected bundled class ${entry.name}")
            }
            new DataInputStream(zip.getInputStream(entry)).withCloseable { input ->
                if (input.readInt() != (int) 0xCAFEBABE) {
                    throw new GradleException("${entry.name}: invalid class header")
                }
                input.readUnsignedShort()
                int major = input.readUnsignedShort()
                if (major > 65) throw new GradleException("${entry.name}: requires newer than Java 21")
            }
            classCount++
        }
    }
    if (classCount == 0) throw new GradleException("${archive.name}: no mod classes")
    logger.lifecycle("${archive.name}: verified metadata, ${classCount} isolated classes and Java 21.")
}

tasks.register('jarSmokeCheck') {
    group = 'verification'
    description = 'Verifies release metadata, class isolation and Java 21 compatibility.'
    dependsOn 'jar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    doLast {
        verifyNeoQuestArchive(builtJar.get().asFile)
    }
}

tasks.register('artifactVerifierTest') {
    group = 'verification'
    description = 'Proves archive verification rejects foreign classes, invalid metadata and newer bytecode.'
    dependsOn 'jar'
    doLast {
        File builtJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        // Establish a valid baseline first. Every fixture copies it and changes exactly one property;
        // an unrelated missing metadata file must not masquerade as successful class-isolation coverage.
        verifyNeoQuestArchive(builtJar)
        Map<String, byte[]> entries = new LinkedHashMap<>()
        new java.util.zip.ZipFile(builtJar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.isDirectory()) return
                zip.getInputStream(entry).withCloseable { input -> entries[entry.name] = input.bytes }
            }
        }
        String classEntry = entries.keySet().find { it.endsWith('.class') }
        byte[] futureClass = java.util.Arrays.copyOf(entries[classEntry], entries[classEntry].length)
        futureClass[6] = (byte) 0
        futureClass[7] = (byte) 66
        def fixtures = [
                [name: 'foreign-class', reason: 'unexpected bundled class',
                 changes: ['forge/net/conczin/mca/Unexpected.class': entries[classEntry]]],
                [name: 'missing-metadata', reason: 'missing META-INF/neoforge.mods.toml',
                 changes: ['META-INF/neoforge.mods.toml': null]],
                [name: 'unexpanded-metadata', reason: 'unexpanded metadata',
                 changes: ['META-INF/neoforge.mods.toml': 'modId="${fixture}"'.getBytes('UTF-8')]],
                [name: 'future-bytecode', reason: 'requires newer than Java 21',
                 changes: [(classEntry): futureClass]]
        ]
        fixtures.each { fixture ->
            Map<String, byte[]> altered = new LinkedHashMap<>(entries)
            fixture.changes.each { name, bytes ->
                if (bytes == null) altered.remove(name)
                else altered[name] = bytes
            }
            File scratch = layout.buildDirectory.file("artifact-verifier/${fixture.name}.jar").get().asFile
            scratch.parentFile.mkdirs()
            new java.util.zip.ZipOutputStream(new FileOutputStream(scratch)).withCloseable { output ->
                altered.each { name, bytes ->
                    output.putNextEntry(new java.util.zip.ZipEntry(name))
                    output.write(bytes)
                    output.closeEntry()
                }
            }
            boolean rejected = false
            try {
                verifyNeoQuestArchive(scratch)
            } catch (GradleException expected) {
                if (!expected.message.contains(fixture.reason)) throw expected
                rejected = true
            }
            if (!rejected) throw new GradleException("Archive verifier accepted ${fixture.name}")
        }
        logger.lifecycle('Archive verifier rejected all four targeted corruptions.')
    }
}

// Compile-only API artifact for sibling add-ons (MCA: Conversations). It carries classes and
// nothing else -- no metadata, no assets, no data -- so a sibling can compile against these types
// without NeoForge ever loading this archive as a mod.
//
// Only `api/` is a stability promise. The quest/ and state/ classes listed below are published as a
// read model, so a consumer can name what it reads; they carry no compatibility guarantee and may
// change in any release. Consumers must never ship these classes -- no shading, no bundling, no
// jar-in-jar. MCA: Quests supplies them at runtime.
def apiExports = [
        'dev/otectus/mcaquests/quest/QuestDefinition',
        'dev/otectus/mcaquests/quest/QuestManager',
        'dev/otectus/mcaquests/quest/situation/QuestDefinitions',
        'dev/otectus/mcaquests/quest/template/PlaceholderResolver',
        'dev/otectus/mcaquests/quest/objective/ObjectiveProgress',
        'dev/otectus/mcaquests/quest/objective/QuestObjective',
        'dev/otectus/mcaquests/quest/objective/QuestObjectiveType',
        'dev/otectus/mcaquests/quest/reward/QuestReward',
        'dev/otectus/mcaquests/quest/reward/QuestRewardType',
        'dev/otectus/mcaquests/quest/condition/QuestCondition',
        'dev/otectus/mcaquests/quest/condition/QuestConditionType',
        'dev/otectus/mcaquests/state/ActiveQuest',
        'dev/otectus/mcaquests/state/PlayerQuestData',
        'dev/otectus/mcaquests/state/QuestAttachments',
        'dev/otectus/mcaquests/state/QuestCapabilities',
]

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Builds the compile-only API artifact published to sibling add-ons.'
    dependsOn tasks.named('compileJava')
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Compiled classes only; processResources output is deliberately not a source here.
    from(sourceSets.main.output.classesDirs) {
        include 'dev/otectus/mcaquests/api/**'
        apiExports.each { export ->
            include "${export}.class"
            include "${export}\$*.class"
        }
    }
    manifest {
        attributes([
                'Specification-Title'  : "${mod_id}-api",
                'Specification-Version': mod_version,
                'Implementation-Title' : "${mod_id}-api"
        ])
    }
}

tasks.named('assemble') {
    dependsOn 'apiJar'
}

tasks.register('verifyApiJar') {
    group = 'verification'
    description = 'Verifies the API artifact carries every published class and no mod metadata.'
    dependsOn 'apiJar'
    def apiArchive = tasks.named('apiJar', Jar).flatMap { it.archiveFile }
    inputs.file(apiArchive)
    doLast {
        File archive = apiArchive.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            if (!names.any { it.startsWith('dev/otectus/mcaquests/api/') }) {
                throw new GradleException("${archive.name}: no dev/otectus/mcaquests/api/ entries")
            }
            apiExports.each { export ->
                if (!names.contains("${export}.class".toString())) {
                    throw new GradleException("${archive.name}: missing export ${export}.class")
                }
            }
            // A resource in here would mean the loader could mistake the API artifact for a mod.
            String resource = names.find {
                it.endsWith('.json') || it.endsWith('.toml') || it.endsWith('.mcmeta')
            }
            if (resource != null) {
                throw new GradleException("${archive.name}: unexpected packaged resource ${resource}")
            }
        }
        logger.lifecycle("${archive.name}: verified ${apiExports.size()} exports and no packaged resources.")
    }
}

tasks.named('check') {
    dependsOn 'jarSmokeCheck', 'artifactVerifierTest', 'verifyApiJar'
}

// Installs the finished jar into a mods folder, so nobody has to copy build/libs by hand. The folder
// comes from -PmodsDir=..., else the MCAQUESTS_MODS_DIR environment variable; nothing is deleted, but
// an older mcaquests jar left behind is called out, because two of them in one folder is a
// duplicate-mod error rather than an upgrade.
tasks.register('installMod') {
    group = 'build'
    description = 'Copies the verified jar into -PmodsDir=<dir> (or $MCAQUESTS_MODS_DIR).'
    dependsOn 'jarSmokeCheck'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def target = (project.findProperty('modsDir') ?: System.getenv('MCAQUESTS_MODS_DIR'))?.toString()
    inputs.file(builtJar)
    doLast {
        if (!target) {
            throw new GradleException('No mods folder given. Pass -PmodsDir=<path to your instance\'s mods folder> ' +
                    'or set the MCAQUESTS_MODS_DIR environment variable.')
        }
        def modsDir = file(target)
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder does not exist: ${modsDir}")
        }
        def source = builtJar.get().asFile
        modsDir.listFiles({ f -> f.name ==~ /^${mod_id}-.*\.jar$/ && f.name != source.name } as FileFilter)
                ?.each { logger.warn("WARNING: ${it.name} is still in ${modsDir}; remove it, or NeoForge will refuse " +
                        "to load two copies of ${mod_id}.") }
        java.nio.file.Files.copy(source.toPath(), new File(modsDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${source.name} to ${modsDir}.")
    }
}

// Explicit release gate: missing atlas/Moonlight inputs fail instead of silently skipping a probe.
tasks.register('mapAtlasesProbeTest', Test) {
    group = 'verification'
    description = 'Checks the exact Map Atlases render and native-action contracts without loading optional classes.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.mapatlases.MapAtlasesJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        ['mapAtlasesJar', 'moonlightJar'].each { key ->
            def value = project.findProperty(key)?.toString()
            if (!value || !file(value).isFile()) throw new GradleException("Supply -P${key}=<exact release jar>")
        }
        systemProperty 'mcaquests.atlas.jar', file(project.property('mapAtlasesJar')).absolutePath
        systemProperty 'mcaquests.moonlight.jar', file(project.property('moonlightJar')).absolutePath
    }
}
if (project.findProperty('requireMapAtlasesJars')?.toString()?.toBoolean()) {
    tasks.named('check').configure { dependsOn 'mapAtlasesProbeTest' }
}
// Reflective adapter: optional artifacts never enter the compile or published dependency graph.
if (project.findProperty('enableMapAtlasesInDev')?.toString()?.toBoolean()) {
    ['mapAtlasesJar', 'moonlightJar'].each { key ->
        def value = project.findProperty(key)?.toString()
        if (!value || !file(value).isFile()) throw new GradleException("Supply -P${key}=<exact release jar>")
        dependencies.add('runtimeOnly', files(value))
    }
}
