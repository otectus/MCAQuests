plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ requires Java 21; the foojay resolver provisions it if absent.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // JUnit tests that need Minecraft classes on the classpath (the whole test suite does —
    // TestBootstrap touches SharedConstants/Bootstrap).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // MCA Reborn via Modrinth Maven, scoped to the maven.modrinth group. The 1.21.1 NeoForge
    // jar is mojmap — no deobf pipeline exists or is needed.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }

    // FTB Quests optional integration — scoped to dev.ftb.mods only.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
}

dependencies {
    // MCA Reborn — plain implementation. The NeoForge jar is mojmap; it also loads as a mod in
    // dev runs (its 1.21.1 mixins are mojmap too), so real MCA behaviour is testable under
    // runClient/runServer. All MCA access is isolated behind dev.otectus.mcaquests.compat.McaCompat.
    implementation "maven.modrinth:minecraft-comes-alive-reborn:${mca_version}"

    // MCA: Reputation — OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its class output (must be the 1.21.1 NeoForge port). Never
    // bundled: the real mod supplies these classes at runtime, and everything that touches them is
    // gated behind ReputationBridge's ModList check.
    //
    // When the ported sibling is absent, the compat.reputation package is excluded from compilation
    // so the rest of the mod stays shippable; the built-in LegacyReputationBackend remains the
    // default and fully functional. Parity for the optional integration lands with the sibling's
    // 1.21.1 port (PORTING_1.21.1_NEOFORGE.md Phase 11).
    def mcaReputationClasses = file("${projectDir}/../MCAReputation_1.21.1/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        logger.warn("MCA: Reputation (1.21.1) classes not found at ${mcaReputationClasses}; " +
                "excluding the optional compat.reputation sources from compilation. " +
                "Port and build MCAReputation_1.21.1 first to compile the integration.")
        sourceSets.main.java.exclude 'dev/otectus/mcaquests/compat/reputation/**'
    }

    // Unit tests for the non-MCA quest engine (spec section 33).
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // FTB Quests optional integration — compile-time only. NEVER shipped, NEVER 'implementation'.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    // Optional: put the FTB stack on the dev runtime for hands-on testing.
    if (project.hasProperty('enableFtbqInDev') && project.enableFtbqInDev.toBoolean()) {
        runtimeOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    }
}

test {
    useJUnitPlatform()
}

// Expand metadata placeholders into neoforge.mods.toml at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
