buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17; target it explicitly (system default JDK is 21).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template's processResources/run setup.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Remap dependency/our-own mixin refmaps SRG->official in dev. NOTE: this does NOT make
            // MCA load in dev — MCA's forge mixins ship with no refmap and hard-coded SRG names, so
            // they only resolve in a production (SRG) runtime. Real MCA behaviour is therefore
            // verified in a production-style instance, not under dev runClient/runServer.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Architectury API (hard runtime dependency of MCA Reborn's Forge build).
    maven { url = 'https://maven.architectury.dev/' }

    // SpongePowered (Mixin annotation processor for our client menu-injection mixin).
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }

    // FTB Quests optional integration — scoped to dev.ftb.mods only.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
}

// Which MCA build dev runs launch with. Overridable per invocation so both MCA package layouts can
// be exercised without editing a file: `./gradlew runServer -PmcaDevVersion=7.7.0-beta.2+1.20.1`.
ext.mcaDevVersion = project.findProperty('mcaDevVersion') ?: mca_dev_version

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older root would go untested, which is exactly how the missing
// forge.net.conczin.mca root reached players. Each is probed in its own class loader, so a root the
// binding no longer recognises fails the build instead of a user's log.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in would only slow the build.
        transitive = false
    }
}

configurations {
    // Keep MCA off the unit-test runtime. Gradle's testRuntimeOnly extends runtimeOnly, so the dev-run
    // MCA jar would otherwise land on testRuntimeClasspath -- and the unit suite is precisely where
    // "MCA is absent" has to be the real, exercised state, because that is the degradation path
    // McaCompatSafeFailTest asserts. McaBindingProbeTest still reaches the real MCA jar, by opening it
    // in a throwaway class loader rather than by having it on the classpath.
    testRuntimeClasspath {
        exclude group: 'maven.modrinth', module: 'minecraft-comes-alive-reborn'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA Reborn — obfuscated production (Universal) jar, remapped to our dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime (that is what lets
    // one jar serve both MCA's forge.net.mca.* layout and the renamed net.conczin.mca.* one). A
    // compile dependency would only invite the static linkage back — NoMcaStaticLinkTest fails the
    // build if it ever returns. runtimeOnly also keeps MCA off testRuntimeClasspath, so the unit
    // suite exercises the genuine "MCA absent" degradation path rather than a half-bound one.
    runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mcaDevVersion}")

    // The probe fleet (see ext.mcaProbeVersions). Deliberately NOT fg.deobf: only Minecraft's methods
    // and fields carry SRG names in a production jar, never its class names, so MCA's own declarations
    // already read as e.g. `getResidents(net.minecraft.server.level.ServerLevel)` -- which is exactly
    // what the manifest's parameter hints compare against. Skipping the deobf round-trip also keeps
    // these configurations out of ForgeGradle's remap pipeline, which only materialises artifacts for
    // configurations it owns and cannot serve one resolved from a test task's doFirst.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }

    // Architectury API (Forge) — required at runtime by MCA, and at compile time by the FTB Quests
    // bridge, which names Architectury event types directly (FtbqEventBridge). Unlike MCA this stays a
    // compile dependency: Architectury has not repackaged, and nothing here has to survive it doing so.
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")


    // MCA: Reputation — OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its dev-mapped class output; both mods use `official` 1.20.1
    // mappings, so the Minecraft type names line up and reobfJar remaps our own references for
    // production. Never bundled: the real mod supplies these classes at runtime, and everything that
    // touches them is gated behind ReputationBridge's ModList check.
    //
    // Build MCA: Reputation first (`../MCAReputation: ./gradlew classes`). When it is absent the
    // compat.reputation package cannot compile, which is why the build fails loudly here rather than
    // silently producing an integration-less jar (spec 9.2).
    def mcaReputationClasses = file("${projectDir}/../MCAReputation/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        logger.warn("MCA: Reputation classes not found at ${mcaReputationClasses}; build it first " +
                "(../MCAReputation: ./gradlew classes) or the optional Reputation integration will not compile.")
    }

    // Mixin annotation processor — generates the refmap for our client menu-injection mixin.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Unit tests for the non-MCA quest engine (spec section 33).
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // FTB Quests optional integration — compile-time only. NEVER shipped, NEVER 'implementation'.
    compileOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")

    // Optional: put the FTB stack on the dev runtime for hands-on testing.
    if (project.hasProperty('enableFtbqInDev') && project.enableFtbqInDev.toBoolean()) {
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")
    }
}

test {
    useJUnitPlatform()
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without MCA ever being
    // linked into the test JVM. They come from the mcaProbe* configurations, one per version, so that
    // Gradle's conflict resolution cannot collapse the fleet down to the newest jar.
    //
    // The whole fleet is probed on every run (see mca_probe_versions), one entry per known package
    // root, so a root the binding no longer recognises fails here. To probe a different set:
    //     ./gradlew test -PmcaProbeVersions=7.7.1-alpha.2+1.20.1
    //
    // Resolved in doFirst, not at configuration time: resolving a configuration while the build is
    // still being configured freezes ForgeGradle's deobf repository before every fg.deobf dependency
    // is registered ("cannot mutate content repository descriptor after repository has been used").
    doFirst {
        systemProperty 'mcaquests.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own
// classloader. Separate from `test` because it needs a jar nobody can resolve from a maven: Townstead
// is published on CurseForge only, so the path is supplied by the person running it.
//
//     ./gradlew townsteadProbeTest -PtownsteadLegacyJar=/path/townstead-0.7.6+1.20.1.jar
//
// Both -PtownsteadModernJar and -PtownsteadLegacyJar are accepted and either may be given alone.
// MCA rides along on `mcaquests.probe.jars` for a load-bearing reason: Townstead is compiled against
// MCA, so enumerating TownsteadAPI's methods resolves an MCA parameter type, and without MCA present
// the whole class reads as unbound and the probe would pass vacuously.
tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.TownsteadBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaquests.townstead.probe.jars',
                ['townsteadModernJar', 'townsteadLegacyJar']
                        .findAll { project.hasProperty(it) }
                        .collect { project.property(it).toString() }
                        .join(File.pathSeparator)
        systemProperty 'mcaquests.probe.jars', configurations.runtimeClasspath
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Resolves the JourneyMap and Xaero binding manifests against real jars, in their own JVM and their
// own class loader. Separate from `test` because both mods are CurseForge-only -- there is no Maven
// to resolve them from and libs/ is gitignored, so the paths are supplied by whoever runs it.
//
//     ./gradlew mapProbeTest -PjourneymapJar=libs/journeymap-forge-1.20.1-6.0.4.jar //                            -PxaeroJar=libs/xaerominimap-forge-1.20.1-26.4.2.jar
//
// Either may be given alone; a mod with no jar is skipped rather than failed. The test unpacks
// JourneyMap's jar-in-jar API for itself -- the outer jar carries none of IClientAPI, Waypoint or
// WaypointFactory, so probing it alone would pass while proving nothing.
tasks.register('mapProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the JourneyMap and Xaero binding manifests against supplied jars.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.map.MapBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaquests.map.probe.journeymap',
                project.findProperty('journeymapJar')?.toString() ?: ''
        systemProperty 'mcaquests.map.probe.xaero',
                project.findProperty('xaeroJar')?.toString() ?: ''
    }
}

// MixinGradle: generate the refmap for our mixin and register the config for reobfuscation.
mixin {
    add sourceSets.main, 'mcaquests.refmap.json'
    config 'mcaquests.mixins.json'
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ForgeGradle reobfuscates in place, so for the moment between `jar` and `reobfJar` the archive
// sitting at build/libs/mcaquests-<version>.jar is the un-reobfuscated one: Minecraft's members still
// carry their official names, which no production runtime knows. A jar copied out of that window
// looks completely normal and then dies the instant a class of ours touches Minecraft --
// `NoSuchFieldError: UNKNOWN` from QuestClientSetup's keybinds, which is how 1.5.0 reached a player's
// mods folder. Both tasks below therefore run after reobfJar and read the finished artifact, and
// `installMod` exists so that copying it by hand -- the thing that lost that race -- is unnecessary.
tasks.register('verifyReobfJar') {
    group = 'verification'
    description = 'Fails if the built jar still names Minecraft members by their official (dev-only) names.'
    dependsOn 'reobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    doLast {
        def jarPath = builtJar.get().asFile
        int srgRefs = 0
        new java.util.zip.ZipFile(jarPath).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith('.class')) {
                    return
                }
                // Constant-pool UTF8 entries are raw bytes; ISO-8859-1 round-trips them, and an SRG
                // member name (m_12345_ / f_12345_) is plain ASCII, so a scan of the text is enough.
                def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                if (text =~ /[mf]_\d+_/) {
                    srgRefs++
                }
            }
        }
        if (srgRefs == 0) {
            throw new GradleException("${jarPath.name} names no Minecraft member by its SRG name, so it was " +
                    "never reobfuscated. Installing it would fail at class-init with NoSuchFieldError. Run " +
                    "`gradlew build` to completion and install build/libs/${jarPath.name} (or use `gradlew installMod`).")
        }
        logger.lifecycle("${jarPath.name}: reobfuscated (${srgRefs} classes carry SRG member names).")
    }
}

tasks.named('build').configure {
    dependsOn 'verifyReobfJar'
}

// Installs the finished jar into a mods folder, so nobody has to copy build/libs by hand and race
// reobfJar for it. The folder comes from -PmodsDir=..., else the MCAQUESTS_MODS_DIR environment
// variable; nothing is deleted, but an older mcaquests jar left behind is called out, because two of
// them in one folder is a duplicate-mod error rather than an upgrade.
tasks.register('installMod') {
    group = 'build'
    description = 'Copies the verified, reobfuscated jar into -PmodsDir=<dir> (or $MCAQUESTS_MODS_DIR).'
    dependsOn 'verifyReobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def target = (project.findProperty('modsDir') ?: System.getenv('MCAQUESTS_MODS_DIR'))?.toString()
    inputs.file(builtJar)
    doLast {
        if (!target) {
            throw new GradleException('No mods folder given. Pass -PmodsDir=<path to your instance\'s mods folder> ' +
                    'or set the MCAQUESTS_MODS_DIR environment variable.')
        }
        def modsDir = file(target)
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder does not exist: ${modsDir}")
        }
        def source = builtJar.get().asFile
        modsDir.listFiles({ f -> f.name ==~ /^${mod_id}-.*\.jar$/ && f.name != source.name } as FileFilter)
                ?.each { logger.warn("WARNING: ${it.name} is still in ${modsDir}; remove it, or Forge will refuse " +
                        "to load two copies of ${mod_id}.") }
        java.nio.file.Files.copy(source.toPath(), new File(modsDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${source.name} to ${modsDir}.")
    }
}
