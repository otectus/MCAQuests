buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17; target it explicitly (system default JDK is 21).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template's processResources/run setup.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Remap dependency/our-own mixin refmaps SRG->official in dev. NOTE: this does NOT make
            // MCA load in dev — MCA's forge mixins ship with no refmap and hard-coded SRG names, so
            // they only resolve in a production (SRG) runtime. Real MCA behaviour is therefore
            // verified in a production-style instance, not under dev runClient/runServer.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Architectury API (hard runtime dependency of MCA Reborn's Forge build).
    maven { url = 'https://maven.architectury.dev/' }

    // SpongePowered (Mixin annotation processor for our client menu-injection mixin).
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }

    // FTB Quests optional integration — scoped to dev.ftb.mods only.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }

    // JourneyMap's client plugin API — scoped to info.journeymap only.
    //
    // Not JourneyMap's own Nexus (jm.gserv.me). That host publishes journeymap-api for 1.19-1.20.6
    // and journeymap-api-forge for 1.21+/26.x, and neither set contains a 1.20.1 build of API 2.0:
    // the closest, `journeymap-api:2.0+1.20-forge`, is a June 2023 snapshot of the *old*
    // journeymap.client.api.* surface, with no @JourneyMapPlugin, no WaypointFactory and no
    // per-waypoint visibility flags. What JourneyMap 1.20.1-6.0.x actually loads is
    // journeymap-api-forge:1.20.1-2.0.0, and modmaven.dev is the reachable mirror carrying it —
    // byte-for-byte the same API surface as the jar-in-jar inside the mod, which mapProbeTest
    // re-checks against a real JourneyMap jar on demand.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModMaven'
                url = 'https://modmaven.dev'
            }
        }
        filter { includeGroup 'info.journeymap' }
    }
}

// Which MCA build dev runs launch with. Overridable per invocation so both MCA package layouts can
// be exercised without editing a file: `./gradlew runServer -PmcaDevVersion=7.7.0-beta.2+1.20.1`.
ext.mcaDevVersion = project.findProperty('mcaDevVersion') ?: mca_dev_version

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older root would go untested, which is exactly how the missing
// forge.net.conczin.mca root reached players. Each is probed in its own class loader, so a root the
// binding no longer recognises fails the build instead of a user's log.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in would only slow the build.
        transitive = false
    }
}

configurations {
    // Keep MCA off the unit-test runtime. Gradle's testRuntimeOnly extends runtimeOnly, so the dev-run
    // MCA jar would otherwise land on testRuntimeClasspath -- and the unit suite is precisely where
    // "MCA is absent" has to be the real, exercised state, because that is the degradation path
    // McaCompatSafeFailTest asserts. McaBindingProbeTest still reaches the real MCA jar, by opening it
    // in a throwaway class loader rather than by having it on the classpath.
    testRuntimeClasspath {
        exclude group: 'maven.modrinth', module: 'minecraft-comes-alive-reborn'
    }
}

// ---------------------------------------------------------------------------------------------
// Townstead API v1: a pinned source build of the frozen public API package (see the dependency
// block below for why). Everything here is compile-time plumbing; nothing it produces is shipped.
// ---------------------------------------------------------------------------------------------
ext.townsteadApiMode = (project.findProperty('townsteadApi') ?: 'typed').toString()

/** Rejects an explicitly supplied API jar that is missing, not an API jar, or carries Townstead internals. */
ext.validateTownsteadApiJar = { File jar ->
    if (!jar.isFile()) {
        throw new GradleException("-PtownsteadApiJar=${jar} does not exist. Supply the townstead-api-<version>-v1.jar " +
                "Townstead's apiJar task produces, or omit the property to build the pinned API from source.")
    }
    boolean entryPoint = false
    List<String> foreign = []
    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().each { entry ->
            if (!entry.name.endsWith('.class')) return
            if (entry.name == 'com/aetherianartificer/townstead/api/v1/TownsteadApiV1.class') entryPoint = true
            if (!entry.name.startsWith('com/aetherianartificer/townstead/api/v1/')) foreign << entry.name
        }
    }
    if (!entryPoint) {
        throw new GradleException("-PtownsteadApiJar=${jar} is not a Townstead API v1 jar: it has no " +
                "com/aetherianartificer/townstead/api/v1/TownsteadApiV1.class. A full Townstead mod jar is not accepted.")
    }
    if (!foreign.isEmpty()) {
        throw new GradleException("-PtownsteadApiJar=${jar} carries classes outside api/v1 (for example " +
                "${foreign.first()}); only the frozen API package may be compiled against.")
    }
}

def townsteadApiFetchDir = file("${projectDir}/.gradle/townstead-api/${townstead_api_commit}")
def townsteadApiSourceRoot = project.findProperty('townsteadApiSources')
        ? file("${project.findProperty('townsteadApiSources')}/src/main/java")
        : new File(townsteadApiFetchDir, 'src')
def townsteadApiPackageDir = 'com/aetherianartificer/townstead/api/v1'
if (project.hasProperty('townsteadApiSources')
        && !new File(townsteadApiSourceRoot, "${townsteadApiPackageDir}/TownsteadApiV1.java").isFile()) {
    // Checked here rather than in the compile task: with no sources Gradle skips that task as
    // NO-SOURCE before any of its actions run, and the failure would surface as sixty unrelated
    // compile errors in the adapter instead of this one line.
    throw new GradleException("-PtownsteadApiSources=${project.findProperty('townsteadApiSources')} has no " +
            "src/main/java/${townsteadApiPackageDir}/TownsteadApiV1.java; point it at a Townstead checkout that ships api.v1.")
}

// Downloads the pinned commit's source archive and keeps only the api/v1 package. Runs once per
// pinned commit; the extracted tree lives under .gradle/, which survives `clean`.
tasks.register('fetchTownsteadApiSources') {
    group = 'build setup'
    description = "Fetches Townstead's api/v1 sources at commit ${townstead_api_commit}."
    def marker = new File(townsteadApiFetchDir, 'commit.txt')
    onlyIf { !project.hasProperty('townsteadApiSources') && !project.hasProperty('townsteadApiJar') }
    outputs.dir(townsteadApiFetchDir)
    outputs.upToDateWhen { marker.isFile() && marker.text.trim() == townstead_api_commit }
    doLast {
        def archive = new File(townsteadApiFetchDir, 'source.tar.gz')
        def url = "${townstead_api_repo}/archive/${townstead_api_commit}.tar.gz"
        townsteadApiFetchDir.mkdirs()
        try {
            new URL(url).withInputStream { input -> archive.withOutputStream { it << input } }
        } catch (IOException e) {
            throw new GradleException("Could not download Townstead's API sources from ${url}: ${e.message}. " +
                    "Retry with network access, pass -PtownsteadApiJar=<jar> or -PtownsteadApiSources=<checkout>, " +
                    "or build an explicitly reflective-only jar with -PtownsteadApi=reflective-only.", e)
        }
        def target = new File(townsteadApiFetchDir, 'src')
        project.delete(target)
        project.copy {
            from(project.tarTree(project.resources.gzip(archive))) {
                include "*/src/main/java/${townsteadApiPackageDir}/**"
                eachFile { details ->
                    // <repo>-<sha>/src/main/java/com/... -> com/...
                    details.path = details.path.substring(details.path.indexOf('/src/main/java/') + '/src/main/java/'.length())
                }
                includeEmptyDirs = false
            }
            into target
        }
        def entryPoint = new File(target, "${townsteadApiPackageDir}/TownsteadApiV1.java")
        if (!entryPoint.isFile()) {
            throw new GradleException("The archive for ${townstead_api_commit} has no ${townsteadApiPackageDir}/TownsteadApiV1.java; " +
                    "townstead_api_commit in gradle.properties must name a Townstead revision that ships api.v1.")
        }
        archive.delete()
        marker.text = townstead_api_commit
    }
}

// Compiles the API package against this project's own Minecraft/Forge classpath (official mappings,
// the same channel Townstead builds with), so member names in its signatures line up exactly.
tasks.register('compileTownsteadApi', JavaCompile) {
    group = 'build setup'
    description = 'Compiles the pinned Townstead api/v1 package.'
    dependsOn 'fetchTownsteadApiSources'
    onlyIf { !project.hasProperty('townsteadApiJar') }
    source = fileTree(townsteadApiSourceRoot) { include "${townsteadApiPackageDir}/**/*.java" }
    classpath = configurations.getByName('minecraft')
    destinationDirectory = layout.buildDirectory.dir('townstead-api/classes')
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none', '-Xlint:none']
    options.release = 17
}

// A Zip rather than a Jar on purpose: the Mixin Gradle plugin hooks every Jar task with a refmap
// step that depends on compileJava, and compileJava depends on this archive.
tasks.register('buildTownsteadApiJar', Zip) {
    group = 'build setup'
    description = 'Packages the compiled Townstead api/v1 package as a compile-only jar.'
    dependsOn 'compileTownsteadApi'
    onlyIf { !project.hasProperty('townsteadApiJar') }
    def manifestDir = layout.buildDirectory.dir('townstead-api/manifest')
    doFirst {
        def manifest = new File(manifestDir.get().asFile, 'META-INF/MANIFEST.MF')
        manifest.parentFile.mkdirs()
        manifest.text = "Manifest-Version: 1.0\r\nTownstead-Api-Commit: ${townstead_api_commit}\r\n" +
                "Townstead-Api-Repository: ${townstead_api_repo}\r\n"
    }
    from tasks.named('compileTownsteadApi', JavaCompile).map { it.destinationDirectory }
    from manifestDir
    archiveBaseName = 'townstead-api'
    archiveVersion = townstead_api_version
    archiveClassifier = 'v1'
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('townstead-api')
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA Reborn — obfuscated production (Universal) jar, remapped to our dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime (that is what lets
    // one jar serve both MCA's forge.net.mca.* layout and the renamed net.conczin.mca.* one). A
    // compile dependency would only invite the static linkage back — NoMcaStaticLinkTest fails the
    // build if it ever returns. The explicit testRuntimeClasspath exclusion above keeps MCA absent,
    // so the unit suite exercises the genuine "MCA absent" degradation path.
    runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mcaDevVersion}")

    // The probe fleet (see ext.mcaProbeVersions). Deliberately NOT fg.deobf: only Minecraft's methods
    // and fields carry SRG names in a production jar, never its class names, so MCA's own declarations
    // already read as e.g. `getResidents(net.minecraft.server.level.ServerLevel)` -- which is exactly
    // what the manifest's parameter hints compare against. Skipping the deobf round-trip also keeps
    // these configurations out of ForgeGradle's remap pipeline, which only materialises artifacts for
    // configurations it owns and cannot serve one resolved from a test task's doFirst.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }

    // Architectury API (Forge) — required at runtime by MCA, and at compile time by the FTB Quests
    // bridge, which names Architectury event types directly (FtbqEventBridge). Unlike MCA this stays a
    // compile dependency: Architectury has not repackaged, and nothing here has to survive it doing so.
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")


    // MCA: Reputation — OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its dev-mapped class output; both mods use `official` 1.20.1
    // mappings, so the Minecraft type names line up and reobfJar remaps our own references for
    // production. Never bundled: the real mod supplies these classes at runtime, and everything that
    // touches them is gated behind ReputationBridge's ModList check.
    //
    // Build MCA: Reputation first (`../MCAReputation: ./gradlew classes`). When it is absent the
    // compat.reputation package cannot compile, which is why the build fails loudly here rather than
    // silently producing an integration-less jar (spec 9.2).
    def mcaReputationClasses = file(project.findProperty('mcaReputationClasses')
            ?: "${projectDir}/../MCAReputation/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        throw new GradleException("MCA: Reputation compile surface missing at ${mcaReputationClasses}. " +
                "Build the sibling (../MCAReputation: ./gradlew classes) or pass " +
                "-PmcaReputationClasses=<compatible class directory>. The integration is optional at runtime.")
    }

    // Townstead public API v1 — OPTIONAL typed adapter, compile-only, never bundled.
    //
    // Townstead 0.8 ships a frozen, versioned integration surface, com.aetherianartificer.townstead.api.v1,
    // which names no MCA type. compat/townstead/v1 is compiled against it and is the only package that
    // may name it (NoTownsteadStaticLinkTest). The API is not published to any Maven and Townstead
    // attaches no jar to its releases, so the build obtains it deterministically from source: the
    // package is fetched from the upstream repository at the commit pinned in gradle.properties
    // (townstead_api_commit) and compiled against this project's own Minecraft/Forge classpath by
    // the buildTownsteadApiJar task below. Nothing from that jar is shipped; Townstead supplies the
    // classes at runtime and TownsteadCompat only loads the adapter after it has confirmed they exist.
    //
    //   -PtownsteadApiJar=<jar>       compile against an explicit API jar instead (validated: it must
    //                                 contain api/v1/TownsteadApiV1.class and nothing outside api/v1)
    //   -PtownsteadApiSources=<dir>   compile the API from a local Townstead checkout instead of the
    //                                 pinned download (the directory that contains src/main/java)
    //   -PtownsteadApi=reflective-only build without the typed adapter at all. The artifact is then
    //                                 named mcaquests-<version>-reflective-only.jar and binds Townstead
    //                                 0.8+ as DISABLED rather than by reflection; it is a development
    //                                 convenience for offline machines and never a release.
    switch (townsteadApiMode) {
        case 'typed':
            def explicitJar = project.findProperty('townsteadApiJar')
            if (explicitJar) {
                def apiJarFile = file(explicitJar)
                validateTownsteadApiJar(apiJarFile)
                logger.lifecycle("Townstead API: compiling the typed adapter against ${apiJarFile}")
                compileOnly files(apiJarFile)
                testCompileOnly files(apiJarFile)
                testRuntimeOnly files(apiJarFile)
            } else {
                def builtApi = tasks.named('buildTownsteadApiJar', Zip).flatMap { it.archiveFile }
                compileOnly files(builtApi)
                testCompileOnly files(builtApi)
                testRuntimeOnly files(builtApi)
            }
            break
        case 'reflective-only':
            logger.warn("Townstead API: -PtownsteadApi=reflective-only -- the typed Townstead adapter is " +
                    "left out of this build. The jar is named mcaquests-${version}-reflective-only.jar and " +
                    "must not be released.")
            sourceSets.main.java.exclude 'dev/otectus/mcaquests/compat/townstead/v1/**'
            sourceSets.test.java.exclude 'dev/otectus/mcaquests/compat/townstead/v1/**'
            break
        default:
            throw new GradleException("Unknown -PtownsteadApi=${townsteadApiMode}; use 'typed' (default) or 'reflective-only'.")
    }

    // Mixin annotation processor — generates the refmap for our client menu-injection mixin.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Unit tests for the non-MCA quest engine (spec section 33).
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JourneyMap optional integration — compile-time only. NEVER shipped, NEVER 'implementation'.
    //
    // Like the guarded FTB Quests and Reputation adapters, this package uses typed compile-only APIs:
    // JourneyMap's entry point is a class carrying @JourneyMapPlugin and implementing IClientPlugin,
    // and neither an annotation nor an implements clause can be produced reflectively. Only
    // compat/journeymap/ names these types, and NoMinimapStaticLinkTest fails the build if anything
    // else does — so a dedicated server, or a client without JourneyMap, never loads that package.
    //
    // Plain compileOnly, not fg.deobf: API 2.0's own signatures use official Minecraft class names
    // (BlockPos, ResourceKey<Level>), which are the same in a production jar, and nothing here calls
    // a Minecraft member through it.
    //
    // testImplementation as well -- compile *and* test runtime, since JourneyMapWaypointBackendTest
    // hands the backend a stub IClientAPI and has to load the real interface to implement it. Test
    // scope only; nothing about this reaches the jar.
    compileOnly "info.journeymap:journeymap-api-forge:${journeymap_api_version}"
    testImplementation "info.journeymap:journeymap-api-forge:${journeymap_api_version}"

    // FTB Quests optional integration — compile-time only. NEVER shipped, NEVER 'implementation'.
    compileOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")

    // Optional: put the FTB stack on the dev runtime for hands-on testing.
    if (project.hasProperty('enableFtbqInDev') && project.enableFtbqInDev.toBoolean()) {
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")
    }

    // Optional: put MCA Capitals on the dev runtime for hands-on testing. Never a compile dependency
    // -- CapitalsBinding resolves it by name -- and never shipped. Capitals only loads with MCA
    // 7.7.1-alpha.2 or newer, which is not the default dev MCA, so both switches are needed:
    //
    //     ./gradlew runClient -PmcaDevVersion=7.7.1-alpha.2+1.20.1 -PenableCapitalsInDev=true
    if (project.hasProperty('enableCapitalsInDev') && project.enableCapitalsInDev.toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:capitals-a-monarchy-mod-for-mca-reborn:2Bj8IiyC")
    }
}

test {
    useJUnitPlatform()
    // Tells the suite which Townstead binding this build declares, so a typed build whose adapter
    // silently failed to compile fails here instead of shipping as reflective-only by accident.
    systemProperty 'mcaquests.townstead.api', townsteadApiMode
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without MCA ever being
    // linked into the test JVM. They come from the mcaProbe* configurations, one per version, so that
    // Gradle's conflict resolution cannot collapse the fleet down to the newest jar.
    //
    // The whole fleet is probed on every run (see mca_probe_versions), one entry per known package
    // root, so a root the binding no longer recognises fails here. To probe a different set:
    //     ./gradlew test -PmcaProbeVersions=7.7.1-alpha.2+1.20.1
    //
    // Resolved in doFirst, not at configuration time: resolving a configuration while the build is
    // still being configured freezes ForgeGradle's deobf repository before every fg.deobf dependency
    // is registered ("cannot mutate content repository descriptor after repository has been used").
    doFirst {
        systemProperty 'mcaquests.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own
// classloader. Separate from `test` because it needs a jar nobody can resolve from a maven: Townstead
// is published on CurseForge only, so the path is supplied by the person running it.
//
//     ./gradlew townsteadProbeTest -PtownsteadLegacyJar=/path/townstead-0.7.6+1.20.1.jar
//
// Both -PtownsteadModernJar and -PtownsteadLegacyJar are accepted and either may be given alone.
// MCA rides along on `mcaquests.probe.jars` for a load-bearing reason: Townstead is compiled against
// MCA, so enumerating TownsteadAPI's methods resolves an MCA parameter type, and without MCA present
// the whole class reads as unbound and the probe would pass vacuously.
tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.TownsteadBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaquests.townstead.probe.jars',
                ['townsteadModernJar', 'townsteadLegacyJar']
                        .findAll { project.hasProperty(it) }
                        .collect { project.property(it).toString() }
                        .join(File.pathSeparator)
        systemProperty 'mcaquests.probe.jars', configurations.runtimeClasspath
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Checks both map integrations against real mod jars, in their own JVM and their own class loader.
// Separate from `test` because the mod jars cannot be resolved from a Maven: both are CurseForge-only
// (libs/ is gitignored), so the paths are supplied by whoever runs it.
//
//     ./gradlew mapProbeTest -PjourneymapJar=libs/journeymap-forge-1.20.1-6.0.4.jar //                            -PxaeroJar=libs/xaerominimap-forge-1.20.1-26.4.2.jar
//
// The two halves ask different questions, because the two integrations are bound differently. Xaero
// ships no API, so its manifest is resolved by name and this is the only thing that can prove the
// names are right. JourneyMap is compiled against, so its members are already pinned by javac -- what
// this checks there is *drift*: the runtime API is the journeymap-api-forge jar-in-jar inside the mod
// jar, the compile API is journeymap_api_version from a Maven mirror, and nothing but this task
// notices the day those two stop agreeing.
//
// Either may be given alone; a mod with no jar is skipped rather than failed -- unless
// -PrequireMapJars=true, which turns every missing jar into a failure so a release gate cannot pass
// on a run that silently probed nothing.
tasks.register('mapProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Xaero binding manifest and the JourneyMap API against supplied jars.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.map.MapBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaquests.map.probe.journeymap',
                project.findProperty('journeymapJar')?.toString() ?: ''
        systemProperty 'mcaquests.map.probe.xaero',
                project.findProperty('xaeroJar')?.toString() ?: ''
        systemProperty 'mcaquests.map.probe.require',
                project.findProperty('requireMapJars')?.toString() ?: 'false'
    }
}

// Replays the Ice & Fire manifest against real Ice & Fire jars. Separate from `check` because neither
// jar is resolvable from a Maven the build controls: Community Edition is on Modrinth and the original
// on CurseForge, so the paths come from whoever runs it.
//
//     ./gradlew iceAndFireProbeTest -PiceandfireCeJar=<path> -PiceandfireOriginalJar=<path>
//
// Either may be given alone; the half with no jar skips itself. Unlike the Townstead and MCA probes
// these are raw jar paths with no configuration and no deobfuscation: the test only reads bytes out of
// a zip and parses a constant pool, and never loads a class from either jar.
tasks.register('iceAndFireProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Ice & Fire registry manifest against supplied Ice & Fire jars.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.iceandfire.IceAndFireJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    onlyIf { project.hasProperty('iceandfireCeJar') || project.hasProperty('iceandfireOriginalJar') }
    doFirst {
        systemProperty 'mcaquests.iceandfire.probe.ce',
                project.findProperty('iceandfireCeJar')?.toString() ?: ''
        systemProperty 'mcaquests.iceandfire.probe.original',
                project.findProperty('iceandfireOriginalJar')?.toString() ?: ''
    }
}

// Replays the Bountiful binding manifest against a real Bountiful jar. Separate from `check` because
// the jar is CurseForge-only, so its path comes from whoever runs it.
//
//     ./gradlew bountifulProbeTest -PbountifulJar=<path>
//
// Bytes only: the test opens the jar as a zip and parses constant pools, and never loads a class from
// it. That is not merely tidy -- Bountiful is Kotlin and needs kotlinforforge and Kambrik to load at
// all, neither of which is on this build's classpath, so a probe that loaded anything could not run.
tasks.register('bountifulProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Bountiful binding manifest against a supplied Bountiful jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.bountiful.BountifulJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    onlyIf { project.hasProperty('bountifulJar') }
    doFirst {
        systemProperty 'mcaquests.bountiful.probe.jar',
                project.findProperty('bountifulJar')?.toString() ?: ''
    }
}

// Replays the Capitals binding manifest against a real MCA Capitals jar, in its own JVM and its own
// class loader. Separate from `check` because the jar comes from Modrinth rather than this build's
// dependency graph, so its path is supplied by whoever runs it:
//
//     ./gradlew capitalsProbeTest -PcapitalsJar=<path>
//
// MCA rides along on `mcaquests.probe.jars` for the same load-bearing reason Townstead's probe needs
// it: Capitals statically imports MCA throughout, so enumerating a Capitals class's methods resolves
// MCA parameter types, and without MCA present whole classes read as unbound and the probe would pass
// vacuously. Only the MCA build Capitals declares support for is fed to it -- 7.7.1-alpha.2+1.20.1,
// the lower bound in its own mods.toml -- because an older one leaves the same members unresolvable.
tasks.register('capitalsProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the MCA Capitals binding manifest against a supplied Capitals jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.capitals.CapitalsBindingProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    onlyIf { project.hasProperty('capitalsJar') }
    doFirst {
        systemProperty 'mcaquests.capitals.probe.jar',
                project.findProperty('capitalsJar')?.toString() ?: ''
        systemProperty 'mcaquests.probe.jars', mcaProbeVersions.indices
                .findAll { i -> mcaProbeVersions[i].startsWith('7.7.1-alpha.2') }
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// MixinGradle: generate the refmap for our mixins and register both configs for reobfuscation.
mixin {
    add sourceSets.main, 'mcaquests.refmap.json'
    config 'mcaquests.mixins.json'
    // The optional-mod config. Its one mixin targets a class no build of this mod ever links
    // against, so it carries remap = false throughout and its plugin decides at load time whether
    // to apply it at all -- but it still has to be registered here, or its class would be missing
    // from the reobfuscated jar's mixin refmap handling entirely.
    config 'mcaquests.compat.mixins.json'
    config 'mcaquests.mapatlases.mixins.json'
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    if (townsteadApiMode == 'reflective-only') {
        archiveClassifier = 'reflective-only'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MCAQuests-Townstead-Api' : townsteadApiMode == 'typed' ? "typed:${townstead_api_commit}" : 'reflective-only'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The Bountiful cash-in mixin names its target as a string, and that target is a class no build
    // of this mod ever has on its compile classpath -- deliberately, since linking against Bountiful
    // is the one thing the whole integration is built not to do. The Mixin annotation processor
    // treats an unresolvable target as an error by default, so it is downgraded here. Everything the
    // processor would have checked is instead checked at runtime by BountifulMixinPlugin, which reads
    // the real class out of the installed mod file and refuses to apply the mixin unless the method
    // is there with the exact descriptor.
    options.compilerArgs += ['-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=note']
}

// ForgeGradle reobfuscates in place, so for the moment between `jar` and `reobfJar` the archive
// sitting at build/libs/mcaquests-<version>.jar is the un-reobfuscated one: Minecraft's members still
// carry their official names, which no production runtime knows. A jar copied out of that window
// looks completely normal and then dies the instant a class of ours touches Minecraft --
// `NoSuchFieldError: UNKNOWN` from QuestClientSetup's keybinds, which is how 1.5.0 reached a player's
// mods folder. Both tasks below therefore run after reobfJar and read the finished artifact, and
// `installMod` exists so that copying it by hand -- the thing that lost that race -- is unnecessary.
tasks.register('verifyReobfJar') {
    group = 'verification'
    description = 'Fails if the built jar still names Minecraft members by their official (dev-only) names.'
    dependsOn 'reobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    doLast {
        def jarPath = builtJar.get().asFile
        verifyQuestArchive(jarPath)
        verifyTownsteadAdapter(jarPath, townsteadApiMode)
    }
}

tasks.named('build').configure {
    dependsOn 'verifyReobfJar'
}

// Installs the finished jar into a mods folder, so nobody has to copy build/libs by hand and race
// reobfJar for it. The folder comes from -PmodsDir=..., else the MCAQUESTS_MODS_DIR environment
// variable; nothing is deleted, but an older mcaquests jar left behind is called out, because two of
// them in one folder is a duplicate-mod error rather than an upgrade.
tasks.register('installMod') {
    group = 'build'
    description = 'Copies the verified, reobfuscated jar into -PmodsDir=<dir> (or $MCAQUESTS_MODS_DIR).'
    dependsOn 'verifyReobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def target = (project.findProperty('modsDir') ?: System.getenv('MCAQUESTS_MODS_DIR'))?.toString()
    inputs.file(builtJar)
    doLast {
        if (!target) {
            throw new GradleException('No mods folder given. Pass -PmodsDir=<path to your instance\'s mods folder> ' +
                    'or set the MCAQUESTS_MODS_DIR environment variable.')
        }
        def modsDir = file(target)
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder does not exist: ${modsDir}")
        }
        def source = builtJar.get().asFile
        modsDir.listFiles({ f -> f.name ==~ /^${mod_id}-.*\.jar$/ && f.name != source.name } as FileFilter)
                ?.each { logger.warn("WARNING: ${it.name} is still in ${modsDir}; remove it, or Forge will refuse " +
                        "to load two copies of ${mod_id}.") }
        java.nio.file.Files.copy(source.toPath(), new File(modsDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${source.name} to ${modsDir}.")
    }
}

apply from: 'gradle/verify-artifact.gradle'

// Explicit release gate: missing atlas/Moonlight inputs fail instead of silently skipping a probe.
tasks.register('mapAtlasesProbeTest', Test) {
    group = 'verification'
    description = 'Checks the exact Map Atlases render and native-action contracts without loading optional classes.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaquests.compat.mapatlases.MapAtlasesJarProbeTest' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        ['mapAtlasesJar', 'moonlightJar'].each { key ->
            def value = project.findProperty(key)?.toString()
            if (!value || !file(value).isFile()) throw new GradleException("Supply -P${key}=<exact release jar>")
        }
        systemProperty 'mcaquests.atlas.jar', file(project.property('mapAtlasesJar')).absolutePath
        systemProperty 'mcaquests.moonlight.jar', file(project.property('moonlightJar')).absolutePath
    }
}
if (project.findProperty('requireMapAtlasesJars')?.toString()?.toBoolean()) {
    tasks.named('check').configure { dependsOn 'mapAtlasesProbeTest' }
}
// Reflective adapter: optional artifacts never enter the compile or published dependency graph.
if (project.findProperty('enableMapAtlasesInDev')?.toString()?.toBoolean()) {
    ['mapAtlasesJar', 'moonlightJar'].each { key ->
        def value = project.findProperty(key)?.toString()
        if (!value || !file(value).isFile()) throw new GradleException("Supply -P${key}=<exact release jar>")
        dependencies.add('runtimeOnly', fg.deobf(files(value)))
    }
}

if (project.findProperty('atlasRuntimeFixture')?.toString()?.toBoolean()) {
    apply from: 'tools/atlas-runtime-test/forge.gradle'
}

if (project.findProperty('townsteadRuntimeFixture')?.toString()?.toBoolean()) {
    apply from: 'tools/townstead-runtime-test/forge.gradle'
}

// A compile-only contract for the sibling add-ons (MCA: Conversations) that link against this mod.
// Classes outside `api/` are included here as a read model of the quest domain, not as a stability
// promise: they change with the mod and downstream code that leans on them will break. Consumers
// compile against this jar and never ship these classes -- MCA: Quests is the only thing that
// supplies them at runtime, and a second copy is a duplicate-class error, not a fallback.
//
// Deliberately NOT reobfuscated: the classes come straight out of build/classes, so Minecraft
// members in their signatures keep their official (Mojang) names, which is what a consumer building
// with the `official` mapping channel resolves against. apiJar is therefore left out of the reobf
// wiring that `jar` goes through, and it carries no resources at all.
def apiExports = [
        'dev/otectus/mcaquests/api/**',
        'dev/otectus/mcaquests/quest/QuestDefinition.class',
        'dev/otectus/mcaquests/quest/QuestDefinition$*.class',
        'dev/otectus/mcaquests/quest/QuestManager.class',
        'dev/otectus/mcaquests/quest/QuestManager$*.class',
        'dev/otectus/mcaquests/quest/situation/QuestDefinitions.class',
        'dev/otectus/mcaquests/quest/situation/QuestDefinitions$*.class',
        'dev/otectus/mcaquests/quest/template/PlaceholderResolver.class',
        'dev/otectus/mcaquests/quest/template/PlaceholderResolver$*.class',
        'dev/otectus/mcaquests/quest/objective/ObjectiveProgress.class',
        'dev/otectus/mcaquests/quest/objective/ObjectiveProgress$*.class',
        'dev/otectus/mcaquests/quest/objective/QuestObjective.class',
        'dev/otectus/mcaquests/quest/objective/QuestObjective$*.class',
        'dev/otectus/mcaquests/quest/objective/QuestObjectiveType.class',
        'dev/otectus/mcaquests/quest/objective/QuestObjectiveType$*.class',
        'dev/otectus/mcaquests/quest/reward/QuestReward.class',
        'dev/otectus/mcaquests/quest/reward/QuestReward$*.class',
        'dev/otectus/mcaquests/quest/reward/QuestRewardType.class',
        'dev/otectus/mcaquests/quest/reward/QuestRewardType$*.class',
        'dev/otectus/mcaquests/quest/condition/QuestCondition.class',
        'dev/otectus/mcaquests/quest/condition/QuestCondition$*.class',
        'dev/otectus/mcaquests/quest/condition/QuestConditionType.class',
        'dev/otectus/mcaquests/quest/condition/QuestConditionType$*.class',
        'dev/otectus/mcaquests/state/ActiveQuest.class',
        'dev/otectus/mcaquests/state/ActiveQuest$*.class',
        'dev/otectus/mcaquests/state/PlayerQuestData.class',
        'dev/otectus/mcaquests/state/PlayerQuestData$*.class',
        'dev/otectus/mcaquests/state/QuestCapabilities.class',
        'dev/otectus/mcaquests/state/QuestCapabilities$*.class',
        'dev/otectus/mcaquests/state/QuestHistory.class',
        'dev/otectus/mcaquests/state/QuestHistory$*.class',
]

// Every entry above that names a single class, without its inner-class companion: verifyApiJar
// checks each of these is actually in the archive, so a rename upstream fails the build here rather
// than downstream in a consumer's compile.
def apiRequiredEntries = apiExports.findAll { it.endsWith('.class') && !it.contains('$') }

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Compile-only API artifact for sibling add-ons; classes only, official mappings.'
    dependsOn 'compileJava'
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output.classesDirs) {
        include apiExports
    }
    manifest {
        attributes([
                'Specification-Title'   : "${mod_id}-api".toString(),
                'Specification-Version' : mod_version.toString(),
                'Implementation-Title'  : "${mod_id}-api".toString()
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'apiJar'
}

tasks.register('verifyApiJar') {
    group = 'verification'
    description = 'Fails if the api jar is missing an exported class or has leaked resources into it.'
    dependsOn 'apiJar'
    def apiArchive = tasks.named('apiJar', Jar).flatMap { it.archiveFile }
    def required = apiRequiredEntries
    inputs.file(apiArchive)
    doLast {
        def jarFile = apiArchive.get().asFile
        def names = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().collect { it.name }
        }
        if (!names.any { it.startsWith('dev/otectus/mcaquests/api/') }) {
            throw new GradleException("${jarFile.name} carries no dev/otectus/mcaquests/api/ classes at all; " +
                    'the export filter matched nothing.')
        }
        def missing = required.findAll { !names.contains(it) }
        if (missing) {
            throw new GradleException("${jarFile.name} is missing exported classes: ${missing.join(', ')}. " +
                    'Either the class moved or was renamed -- fix apiExports, or the consumers break.')
        }
        def resources = names.findAll { it.endsWith('.json') || it.endsWith('.toml') || it.endsWith('.mcmeta') }
        if (resources) {
            throw new GradleException("${jarFile.name} contains resources: ${resources.join(', ')}. " +
                    'The api jar must be classes only; a shipped mods.toml would make it look like a mod.')
        }
        logger.lifecycle("${jarFile.name}: ${names.count { it.endsWith('.class') }} classes, no resources.")
    }
}

tasks.named('build').configure {
    dependsOn 'verifyApiJar'
}
