# Memory for the Gradle daemon. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# org.gradle.java.home intentionally unset: rely on JAVA_HOME / the foojay toolchain resolver so
# the build works on any machine. MC 1.21.1 requires JDK 21; the toolchain provisions it.

## Minecraft / NeoForge
minecraft_version=1.21.1
# Bounded to 1.21.1 / the 21.1 NeoForge line on purpose: the payload codecs, the mojmap mixin
# targets and the MCA 1.21.1 dependency are all 1.21.1-specific, and the `mca [7.7,8)` range does
# not constrain the Minecraft version on its own.
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
neoforge_version_range=[21.1.0,21.2)
loader_version_range=[1,)

# Parchment parameter names (matches MCA upstream).
parchment_minecraft=1.21.1
parchment_version=2024.11.17

## Dependencies
# MCA Reborn 1.21.1 NeoForge build via Modrinth Maven. NOT obfuscated; no deobf pipeline exists or
# is needed under NeoForge (mojmap at runtime).
#
# RUNTIME ONLY. Nothing in src/main/java references an MCA type: every MCA class and member is
# resolved by name at runtime by compat.mca.McaBinding, so one jar works across MCA's package-root
# migrations. This version is therefore only what dev runClient/runServer launches with -- it is not
# a compile dependency and does not pin the mod.
#
# PINNED BY MODRINTH VERSION ID: a plain "<version>+1.21.1" string is ambiguous on Modrinth Maven
# (the Fabric and NeoForge files share it) and resolution grabs the Fabric jar (intermediary names,
# fabric.mod.json). S2Ln2tIn is mca-neoforge-7.7.36-beta.3+1.21.1.jar.
# Override per invocation, e.g. `./gradlew runServer -PmcaDevVersion=YKhJZ85x`.
mca_dev_version=S2Ln2tIn
# Every MCA build McaBindingProbeTest replays the manifest against, comma-separated, each in its own
# class loader: S2Ln2tIn = 7.7.36-beta.3+1.21.1, YKhJZ85x = 7.7.22+1.21.1. Add a version id here
# whenever MCA moves again, so the build catches the move instead of a player's log. Local jars no
# Maven can serve are appended with -PmcaProbeJars=<path;path>.
mca_probe_versions=S2Ln2tIn,YKhJZ85x
# Range advertised to the loader in neoforge.mods.toml.
mca_version_range=[7.7,8)
# architectury_version -- DELETED. MCA 1.21.1 dropped Architectury; the FTB 2101.x stack still pulls
# it transitively at compile time, which is a repository scope, not a declared dependency.

## Mod metadata
mod_id=mcaquests
mod_name=MCA: Quests
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
# Version is unchanged by the 1.21.1/NeoForge port -- the platform is carried by the artifact's
# MC/loader targeting, not the mod's own version number.
mod_version=1.5.3
mod_group_id=dev.otectus.mcaquests
mod_authors=otectus
mod_description=An RPG-style, datapack-driven quest system for Minecraft Comes Alive: Reborn villagers.

## FTB Quests optional-compat (compileOnly; never shipped). Artifacts renamed *-neoforge.
ftb_quests_version=2101.1.31
# 2101.1.35, not .34: ftb-quests-neoforge 2101.1.31's POM requires .35 and Gradle upgrades the
# classpath to it anyway, so pinning .34 only misdocumented what was actually compiled against.
ftb_library_version=2101.1.35
ftb_teams_version=2101.1.10
ftbquests_version_range=[2101.1,)
## Set true to add the FTB stack to dev runs for manual testing
enableFtbqInDev=false

## MCA: Reputation optional-compat (compiled against the sibling's class output; never shipped)
mcareputation_version_range=[0.2,)

## JourneyMap client plugin API (compileOnly; never shipped). The NeoForge artifact, mirrored on
## modmaven.dev; JourneyMap 1.21.1-6.0.x carries the same API as a jar-in-jar.
journeymap_api_version=2.0.0-1.21.1
journeymap_version_range=[1.21.1-6.0.0,)

## Optional client-side / server-side integrations bound by name at runtime (never compiled against)
xaero_version_range=[26.0,27)
townstead_version_range=[0.7.5,0.8)
