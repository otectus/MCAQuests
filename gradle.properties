# Memory for the Minecraft decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# Force Gradle + the toolchain onto JDK 17 (system default here is JDK 21, which
# ForgeGradle 6 does not tolerate). Change if your JDK 17 lives elsewhere.
# org.gradle.java.home intentionally unset: rely on JAVA_HOME / the foojay toolchain resolver so
# the build works on any machine (the previous absolute Linux path did not).

## Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies (MCA Reborn pulls Architectury at runtime)
# MCA Reborn for 1.20.1 Forge, via Modrinth Maven (accepts the version string directly).
#
# RUNTIME ONLY. Nothing in src/main/java references an MCA type any more: every MCA class and member
# is resolved by name at runtime by compat.mca.McaBinding, so one jar works across MCA's package-root
# migrations. This version is therefore only what dev runClient/runServer launches with -- it is not
# a compile dependency and does not pin the mod.
# Override per-invocation, e.g. `./gradlew runServer -PmcaDevVersion=7.7.0-beta.2+1.20.1`.
mca_dev_version=7.6.20+1.20.1
# Every MCA build McaBindingProbeTest replays the manifest against, comma-separated, each in its own
# class loader. One entry per known package root, because the root cannot be inferred from the version
# number: 7.6.20 and 7.7.0-beta.2 are forge.net.mca, 7.7.1-alpha.2 is forge.net.conczin.mca. Add a
# version here whenever MCA moves again, so the build catches the move instead of a player's log.
mca_probe_versions=7.6.20+1.20.1,7.7.0-beta.2+1.20.1,7.7.1-alpha.2+1.20.1
# Architectury API (Forge) — hard runtime requirement of MCA's Forge build.
architectury_version=9.2.14

## Mod metadata
mod_id=mcaquests
mod_name=MCA: Quests
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
mod_version=1.5.2
mod_group_id=dev.otectus.mcaquests
mod_authors=otectus
mod_description=An RPG-style, datapack-driven quest system for Minecraft Comes Alive: Reborn villagers.

## FTB Quests optional-compat (compileOnly; never shipped)
ftb_quests_version=2001.4.22
ftb_library_version=2001.2.9
ftb_teams_version=2001.3.0
## Set true to add the FTB stack to dev runs for manual testing
enableFtbqInDev=false
