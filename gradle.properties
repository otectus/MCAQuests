# Memory for the Gradle daemon. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# org.gradle.java.home intentionally unset: rely on JAVA_HOME / the foojay toolchain resolver so
# the build works on any machine. MC 1.21.1 requires JDK 21; the toolchain provisions it.

## Minecraft / NeoForge
minecraft_version=1.21.1
# Bounded to 1.21.1 / the 21.1 NeoForge line on purpose: the payload codecs, the mojmap mixin
# targets and the MCA 7.7.22+1.21.1 dependency are all 1.21.1-specific, and the `mca [7.7,8)`
# range does not constrain the Minecraft version on its own.
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
neoforge_version_range=[21.1.0,21.2)
loader_version_range=[1,)

# Parchment parameter names (matches MCA upstream).
parchment_minecraft=1.21.1
parchment_version=2024.11.17

## Dependencies
# MCA Reborn 1.21.1 NeoForge build via Modrinth Maven. NOT obfuscated; no deobf pipeline exists
# or is needed under NeoForge (mojmap at runtime).
# PINNED BY MODRINTH VERSION ID: the plain version string "7.7.22+1.21.1" is ambiguous on Modrinth
# Maven (Fabric + NeoForge files share it) and resolution grabbed the Fabric jar (intermediary
# names, fabric.mod.json). YKhJZ85x is the NeoForge 7.7.22+1.21.1 file (mca-neoforge-7.7.22+1.21.1.jar).
mca_version=YKhJZ85x
# architectury_version — DELETED. MCA 1.21.1 dropped Architectury.

## Mod metadata
mod_id=mcaquests
mod_name=MCA: Quests
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
# Version is unchanged by the 1.21.1/NeoForge port — the platform is carried by the artifact's
# MC/loader targeting, not the mod's own version number.
mod_version=1.1.0
mod_group_id=dev.otectus.mcaquests
mod_authors=otectus
mod_description=An RPG-style, datapack-driven quest system for Minecraft Comes Alive: Reborn villagers.

## FTB Quests optional-compat (compileOnly; never shipped). Artifacts renamed *-neoforge.
ftb_quests_version=2101.1.31
# 2101.1.35, not .34: ftb-quests-neoforge 2101.1.31's POM requires .35 and Gradle upgrades the
# classpath to it anyway, so pinning .34 only misdocumented what was actually compiled against.
ftb_library_version=2101.1.35
ftb_teams_version=2101.1.10
## Set true to add the FTB stack to dev runs for manual testing
enableFtbqInDev=false
